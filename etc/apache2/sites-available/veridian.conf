<VirtualHost 127.0.0.1:8080>
    ServerName bwarchive.lib.lehigh.edu

    RemoteIPHeader X-Forwarded-For
    RemoteIPTrustedProxy 127.0.0.1
    SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on

    DocumentRoot /opt/veridian3/lehigh-veridian/lehigh/custom/lehigh/web

    RewriteEngine On
    RewriteRule ^/$ /cgi-bin/lehigh [PT]
    ScriptAlias /cgi-bin /opt/veridian3/lehigh-veridian/lehigh/cgi-bin

    <Directory /opt/veridian3/lehigh-veridian/lehigh/cgi-bin>
        AllowOverride AuthConfig
        Options FollowSymLinks ExecCGI
        Require all granted
    </Directory>

    Alias /web /opt/veridian3/lehigh-veridian/lehigh/web

    <Directory /opt/veridian3/lehigh-veridian/lehigh/web>
        AllowOverride AuthConfig
        Options FollowSymLinks
        Require all granted
    </Directory>

    Alias /custom/lehigh/web /opt/veridian3/lehigh-veridian/lehigh/custom/lehigh/web

    <Directory /opt/veridian3/lehigh-veridian/lehigh/custom/lehigh/web>
        AllowOverride AuthConfig
        Options FollowSymLinks
        Require all granted
    </Directory>
</VirtualHost>
